name: Colector BOA

on:
  workflow_dispatch: {}
  schedule:
    # Ventana crítica (1 jul - 30 sep): cada 30 min, 08:00-20:00, L-V.
    - cron: "*/30 8-20 * 7-9 1-5"
      timezone: Europe/Madrid
    # Resto del año: cada hora, 08:00-20:00, L-V.
    - cron: "0 8-20 * 1-6,10-12 1-5"
      timezone: Europe/Madrid

permissions:
  contents: write

concurrency:
  group: colector-boa
  cancel-in-progress: false

jobs:
  colecta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar colector
        run: python -m boa_monitor.main

      - name: Commit de los datos si han cambiado
        run: |
          git config user.name "colector-boa[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "chore: colecta BOA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
