name: Prueba de contrato (fuente BOA)

on:
  workflow_dispatch: {}
  schedule:
    # Semanal, lunes 07:15 Europe/Madrid. Descarga en vivo una fecha pasada conocida.
    - cron: "15 7 * * 1"
      timezone: Europe/Madrid

permissions:
  issues: write

jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar que el RSS del BOA sigue teniendo la forma documentada
        id: verificacion
        run: python -m boa_monitor.contrato

      - name: Abrir issue si el contrato se ha roto
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Prueba de contrato del BOA ha fallado",
              body: "El RSS del BOA ya no tiene la forma documentada en CLAUDE.md sección 7.1.1. Revisar el log de esta ejecución antes de confiar en el colector.",
              labels: ["contrato-boa"],
            });
